<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Vinyl Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="cosmic-background">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>

    <div class="app-container">
      <nav class="glass-nav">
        <div class="nav-brand">
          <div class="brand-logo">
            <div class="logo-ring"></div>
            <div class="logo-core"></div>
          </div>
          <h1>VINYL<span class="gradient-text">.OS</span></h1>
        </div>
        <div class="nav-actions">
          <button
            class="btn-primary glow-effect"
            onclick="openModal('addModal')"
          >
            <span class="icon-plus">+</span>
            <span>Log Record</span>
          </button>
        </div>
      </nav>

      <main class="main-content">
        <div class="hud-controls">
          <div class="search-wrapper">
            <svg
              class="search-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Search database..."
              oninput="applyFilters()"
            />
            <div class="input-highlight"></div>
          </div>

          <div class="filter-group">
            <div class="select-wrapper">
              <select id="genreFilter" onchange="applyFilters()">
                <option value="">All Frequencies</option>
              </select>
            </div>

            <div class="select-wrapper">
              <select id="sortBy" onchange="applyFilters()">
                <option value="createdAt">Timeline</option>
                <option value="title">Title</option>
                <option value="artist">Artist</option>
                <option value="year">Cycle</option>
              </select>
            </div>

            <div class="select-wrapper">
              <select id="sortOrder" onchange="applyFilters()">
                <option value="desc">Desc</option>
                <option value="asc">Asc</option>
              </select>
            </div>
          </div>
        </div>

        <div id="vinylsContainer" class="hologrid"></div>
      </main>
    </div>

    <dialog id="viewModal" class="glass-modal">
      <div class="modal-wrapper">
        <button class="modal-close" onclick="closeModal('viewModal')">×</button>

        <div class="modal-grid">
          <div class="visual-sector">
            <div class="holo-record-player">
              <div class="holo-record spinning">
                <div class="grooves"></div>
                <div class="label-art"></div>
              </div>
              <div class="spindle"></div>
            </div>
          </div>

          <div class="data-sector">
            <div class="header-group">
              <div class="text-content">
                <h2 id="viewTitle" class="glitch-text" data-text="">
                  Loading...
                </h2>
                <p id="viewArtist" class="artist-pill"></p>
              </div>
              <div class="action-row">
                <button
                  class="btn-icon"
                  onclick="editFromView()"
                  title="Modify Data"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                  >
                    <path
                      d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                    ></path>
                    <path
                      d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                    ></path>
                  </svg>
                </button>
                <button
                  class="btn-icon danger"
                  onclick="deleteFromView()"
                  title="Purge Data"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                  >
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path
                      d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                    ></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="meta-grid">
              <div class="meta-cell">
                <label>Cycle</label>
                <span id="viewYear" class="mono-value"></span>
              </div>
              <div class="meta-cell">
                <label>Frequency</label>
                <span id="viewGenre" class="mono-value"></span>
              </div>
              <div class="meta-cell">
                <label>Label</label>
                <span id="viewLabel" class="mono-value"></span>
              </div>
            </div>

            <div id="viewDescriptionContainer" class="desc-box">
              <p id="viewDescription"></p>
            </div>

            <div class="track-module">
              <h3>Audio Sequence</h3>
              <div id="viewTracks" class="track-list"></div>
            </div>
          </div>
        </div>
      </div>
    </dialog>

    <dialog id="addModal" class="glass-modal">
      <div class="modal-wrapper compact">
        <button class="modal-close" onclick="closeModal('addModal')">×</button>
        <h2 id="formTitle" class="modal-title">Initialize Record</h2>

        <form id="vinylForm" class="cyber-form">
          <input type="hidden" id="editId" />

          <div class="form-row">
            <div class="input-group">
              <input type="text" name="title" placeholder=" " required />
              <label>Record Title</label>
              <div class="bar"></div>
            </div>
            <div class="input-group">
              <input type="text" name="artist" placeholder=" " required />
              <label>Artist Entity</label>
              <div class="bar"></div>
            </div>
          </div>

          <div class="form-row three-col">
            <div class="input-group">
              <input
                type="number"
                name="year"
                min="1900"
                max="2099"
                placeholder=" "
              />
              <label>Year</label>
              <div class="bar"></div>
            </div>
            <div class="input-group">
              <input type="text" name="genre" placeholder=" " />
              <label>Genre</label>
              <div class="bar"></div>
            </div>
            <div class="input-group">
              <input type="text" name="label" placeholder=" " />
              <label>Label</label>
              <div class="bar"></div>
            </div>
          </div>

          <div class="input-group">
            <textarea name="description" rows="2" placeholder=" "></textarea>
            <label>Data Logs / Description</label>
            <div class="bar"></div>
          </div>

          <div class="tracks-section">
            <div class="section-head">
              <h3>Track Sequence</h3>
              <button type="button" onclick="addTrackInput()" class="btn-small">
                + Seq
              </button>
            </div>
            <div id="tracksContainer" class="tracks-editor"></div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              onclick="closeModal('addModal')"
              class="btn-text"
            >
              Abort
            </button>
            <button type="submit" class="btn-primary">
              <span id="submitText">Upload Data</span>
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <div id="toastContainer" class="toast-container"></div>

    <script>
      const API_URL = "/vinyls";
      let currentVinyls = [];
      let trackCount = 0;
      let currentEditId = null;

      /* --- UI Utilities --- */
      const showToast = (msg, type = "success") => {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `<div class="toast-icon"></div><span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "1";
          toast.style.transform = "translateY(0)";
        }, 10);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(20px)";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      };

      const openModal = (id) => {
        const modal = document.getElementById(id);
        if (id === "addModal") {
          // Reset form if opening add modal fresh
          if (!currentEditId) resetForm();
        }
        modal.showModal();
        modal.classList.add("active");
      };

      const closeModal = (id) => {
        const modal = document.getElementById(id);
        modal.close();
        modal.classList.remove("active");
        if (id === "viewModal") currentEditId = null;
        if (id === "addModal") resetForm();
      };

      const resetForm = () => {
        document.getElementById("vinylForm").reset();
        document.getElementById("editId").value = "";
        document.getElementById("tracksContainer").innerHTML = "";
        document.getElementById("formTitle").textContent = "Initialize Record";
        document.getElementById("submitText").textContent = "Upload Data";
        currentEditId = null;
        trackCount = 0;
      };

      /* --- Logic --- */
      async function loadVinyls(filters = {}) {
        const container = document.getElementById("vinylsContainer");
        container.innerHTML = `
        <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
      `;

        try {
          const queryParams = new URLSearchParams(filters);
          const response = await fetch(`${API_URL}?${queryParams}`);
          currentVinyls = await response.json();

          if (currentVinyls.length === 0) {
            container.innerHTML = `
            <div class="empty-state">
              <div class="empty-holo"></div>
              <h3>Database Empty</h3>
              <button onclick="openModal('addModal')" class="btn-primary">Initialize First Entry</button>
            </div>`;
            return;
          }

          // Populate Genres
          const genres = [
            ...new Set(currentVinyls.map((v) => v.genre).filter(Boolean)),
          ];
          const genreSelect = document.getElementById("genreFilter");
          const currentVal = genreSelect.value;
          genreSelect.innerHTML =
            '<option value="">All Frequencies</option>' +
            genres
              .map(
                (g) =>
                  `<option value="${escapeHtml(g)}" ${
                    g === currentVal ? "selected" : ""
                  }>${escapeHtml(g)}</option>`
              )
              .join("");

          // Render Grid
          container.innerHTML = currentVinyls
            .map(
              (vinyl) => `
          <div class="holo-card" onclick="viewVinyl('${
            vinyl.id
          }')" onmousemove="tiltCard(event, this)" onmouseleave="resetTilt(this)">
            <div class="card-inner">
              <div class="card-visual">
                <div class="vinyl-disc-small">
                  <div class="disc-groove"></div>
                </div>
                <div class="card-shine"></div>
              </div>
              <div class="card-info">
                <div class="card-header">
                  <h3>${escapeHtml(vinyl.title)}</h3>
                  <span class="artist-tag">${escapeHtml(vinyl.artist)}</span>
                </div>
                <div class="card-stats">
                  <span>${vinyl.year || "N/A"}</span>
                  <span>${vinyl.tracks.length} TRK</span>
                </div>
              </div>
            </div>
          </div>
        `
            )
            .join("");
        } catch (error) {
          container.innerHTML = `<div class="error-msg">Connection to Database Failed</div>`;
        }
      }

      function tiltCard(e, card) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
      }

      function resetTilt(card) {
        card.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)`;
      }

      /* --- CRUD Operations --- */

      async function viewVinyl(id) {
        try {
          const response = await fetch(`${API_URL}/${id}`);
          const vinyl = await response.json();

          document.getElementById("viewTitle").textContent = vinyl.title;
          document
            .getElementById("viewTitle")
            .setAttribute("data-text", vinyl.title);
          document.getElementById("viewArtist").textContent = vinyl.artist;
          document.getElementById("viewYear").textContent = vinyl.year || "//";
          document.getElementById("viewGenre").textContent =
            vinyl.genre || "//";
          document.getElementById("viewLabel").textContent =
            vinyl.label || "//";
          document.getElementById("viewDescription").textContent =
            vinyl.description || "No data logs available.";

          document.getElementById("viewTracks").innerHTML = vinyl.tracks.length
            ? vinyl.tracks
                .map(
                  (t) => `
          <div class="track-row">
             <span class="t-side">${t.side}</span>
             <span class="t-name">${escapeHtml(t.name)}</span>
             <span class="t-time">${escapeHtml(t.duration)}</span>
          </div>
        `
                )
                .join("")
            : '<div class="no-tracks">No audio sequence data.</div>';

          currentEditId = vinyl.id;
          openModal("viewModal");
        } catch (e) {
          showToast("Read Error", "error");
        }
      }

      async function editFromView() {
        closeModal("viewModal");
        const id = currentEditId;

        try {
          const response = await fetch(`${API_URL}/${id}`);
          const vinyl = await response.json();

          document.getElementById("formTitle").textContent = "Modify Record";
          document.getElementById("submitText").textContent = "Update Database";
          document.getElementById("editId").value = vinyl.id;

          const form = document.getElementById("vinylForm");
          form.title.value = vinyl.title;
          form.artist.value = vinyl.artist;
          form.year.value = vinyl.year || "";
          form.genre.value = vinyl.genre || "";
          form.label.value = vinyl.label || "";
          form.description.value = vinyl.description || "";

          const container = document.getElementById("tracksContainer");
          container.innerHTML = "";
          trackCount = 0;
          vinyl.tracks.forEach((t) => addTrackInput(t));

          currentEditId = id; // Ensure ID is set for the form submit
          openModal("addModal");
        } catch (e) {
          showToast("Fetch Error", "error");
        }
      }

      function addTrackInput(track = null) {
        trackCount++;
        const div = document.createElement("div");
        div.className = "track-input-grid";
        const sides = ["A1", "A2", "A3", "A4", "B1", "B2", "B3", "B4"]
          .map(
            (s) =>
              `<option value="${s}" ${
                track && track.side === s ? "selected" : ""
              }>${s}</option>`
          )
          .join("");

        div.innerHTML = `
        <select name="track_side_${trackCount}" class="track-select">${sides}</select>
        <input type="text" name="track_name_${trackCount}" value="${
          track ? escapeHtml(track.name) : ""
        }" placeholder="Track Title" required />
        <input type="text" name="track_duration_${trackCount}" value="${
          track ? escapeHtml(track.duration) : ""
        }" placeholder="00:00" pattern="\\d{1,2}:\\d{2}" required class="track-time"/>
        <button type="button" onclick="this.parentElement.remove()" class="btn-x">×</button>
      `;
        document.getElementById("tracksContainer").appendChild(div);
      }

      // Form Handler
      document
        .getElementById("vinylForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          const editId = document.getElementById("editId").value;

          const data = {
            title: formData.get("title"),
            artist: formData.get("artist"),
            year: formData.get("year") ? parseInt(formData.get("year")) : null,
            label: formData.get("label") || null,
            genre: formData.get("genre") || null,
            description: formData.get("description") || null,
            tracks: [],
          };

          for (let i = 1; i <= trackCount; i++) {
            const name = formData.get(`track_name_${i}`);
            if (name) {
              data.tracks.push({
                side: formData.get(`track_side_${i}`),
                name,
                duration: formData.get(`track_duration_${i}`),
              });
            }
          }

          const url = editId ? `${API_URL}/${editId}` : API_URL;
          const method = editId ? "PUT" : "POST";

          try {
            const res = await fetch(url, {
              method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
            if (res.ok) {
              closeModal("addModal");
              loadVinyls();
              showToast(editId ? "Database Updated" : "Entry Initialized");
            } else {
              showToast("Operation Failed", "error");
            }
          } catch (err) {
            showToast("Network Error", "error");
          }
        });

      async function deleteFromView() {
        if (
          !confirm("Confirm purge of this record? This action is irreversible.")
        )
          return;
        try {
          const res = await fetch(`${API_URL}/${currentEditId}`, {
            method: "DELETE",
          });
          if (res.ok) {
            closeModal("viewModal");
            loadVinyls();
            showToast("Record Purged");
          }
        } catch (e) {
          showToast("Delete Failed", "error");
        }
      }

      function applyFilters() {
        const filters = {
          search: document.getElementById("searchInput").value,
          genre: document.getElementById("genreFilter").value,
          sortBy: document.getElementById("sortBy").value,
          order: document.getElementById("sortOrder").value,
        };
        Object.keys(filters).forEach(
          (key) => !filters[key] && delete filters[key]
        );
        loadVinyls(filters);
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Init
      loadVinyls();
    </script>
  </body>
</html>
