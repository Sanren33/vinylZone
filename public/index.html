<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinyl Zone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-container">
      <!-- Navigation -->
      <nav class="main-nav">
        <div class="nav-brand">
          <div class="vinyl-icon"></div>
          <h1>VINYL ZONE</h1>
        </div>
        <div class="nav-actions" id="navActions">
          <!-- Auth buttons will be inserted here -->
        </div>
      </nav>

      <!-- Main Content -->
      <main class="main-content" id="mainContent">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading your collection...</p>
        </div>
      </main>
    </div>

    <!-- View Modal -->
    <div id="viewModal" class="modal">
      <div class="modal-backdrop" onclick="closeViewModal()"></div>
      <div class="modal-content view-modal-content">
        <button class="modal-close" onclick="closeViewModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>

        <div class="modal-layout">
          <div class="vinyl-visual">
            <div class="detail-actions">
              <button
                class="btn-icon tooltip"
                id="wishlistToggleBtn"
                onclick="toggleWishlist()"
              >
                🎁
                <span class="tooltiptext" id="wishlistToggleText"
                  >Add to wishlist</span
                >
              </button>
            </div>
            <div class="vinyl-record"></div>
            <div class="collection-accordion" id="collectionAccordion">
              <button
                class="collapse-toggle"
                type="button"
                id="collectionToggleBtn"
                onclick="toggleCollectionForm()"
                aria-expanded="false"
              >
                <span id="collectionToggleLabel">Add to Collection</span>
                <span class="collapse-arrow" id="collectionToggleArrow">▼</span>
              </button>
              <div id="collectionFormBody" class="collapse-body">
                <div class="form-row">
                  <div class="form-field">
                    <label>Price Paid ($)</label>
                    <input
                      type="number"
                      step="0.01"
                      id="collectionPrice"
                      placeholder="e.g., 24.99"
                    />
                  </div>
                  <div class="form-field">
                    <label>Condition</label>
                    <select id="collectionCondition">
                      <option value="">Select condition</option>
                      <option value="Mint">Mint</option>
                      <option value="Very Good">Very Good</option>
                      <option value="Good">Good</option>
                      <option value="Fair">Fair</option>
                      <option value="Poor">Poor</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label>Purchased At</label>
                    <input type="date" id="collectionDate" />
                  </div>
                  <div class="form-field">
                    <label>Notes</label>
                    <textarea
                      id="collectionNote"
                      rows="2"
                      placeholder="Store, pressing details, memories..."
                    ></textarea>
                  </div>
                </div>

                <div class="form-actions">
                  <button
                    type="button"
                    id="collectionRemoveBtn"
                    class="btn-secondary"
                    style="display: none;"
                    onclick="removeFromCollection()"
                  >
                    Remove from Collection
                  </button>
                  <button
                    type="button"
                    id="collectionSaveBtn"
                    class="btn-primary"
                    onclick="saveToCollection()"
                  >
                    Add
                  </button>
                </div>
                <p class="helper-text" id="collectionMeta"></p>
              </div>
            </div>
          </div>

          <div class="vinyl-details">
            <div class="details-header">
              <div class="title-group">
                <h2 id="viewTitle" class="detail-title"></h2>
                <p id="viewArtist" class="detail-artist"></p>
              </div>
            </div>

            <div class="details-meta">
              <div class="meta-item">
                <span class="meta-label">Year</span>
                <span id="viewYear" class="meta-value">—</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">Genre</span>
                <span id="viewGenre" class="meta-value">—</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">Label</span>
                <span id="viewLabel" class="meta-value">—</span>
              </div>
            </div>

            <div
              id="viewDescriptionContainer"
              class="description-container"
              style="display: none;"
            >
              <h3 class="section-title">Description</h3>
              <p id="viewDescription" class="description-text"></p>
            </div>

            <div class="tracklist-container">
              <h3 class="section-title">Tracklist</h3>
              <div id="viewTracks" class="tracklist"></div>
            </div>

            <div class="modal-actions">
              <button
                class="btn-danger tooltip"
                id="deleteRecordBtn"
                onclick="deleteFromView()"
              >
                Delete Record
                <span class="tooltiptext" id="deleteRecordTooltip">
                  Delete this record
                </span>
              </button>
              <button
                class="btn-edit"
                onclick="editFromView()"
                title="Edit Record"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path
                    d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                  ></path>
                  <path
                    d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                  ></path>
                </svg>
                <span>Edit</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="addModal" class="modal">
      <div class="modal-backdrop" onclick="closeAddModal()"></div>
      <div class="modal-content add-modal-content">
        <button class="modal-close" onclick="closeAddModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>

        <h2 id="formTitle" class="form-title">Add New Record</h2>

        <form id="vinylForm" class="vinyl-form">
          <input type="hidden" id="editId" />

          <div class="form-row">
            <div class="form-field">
              <label>Title *</label>
              <input type="text" name="title" required />
            </div>
            <div class="form-field">
              <label>Artist *</label>
              <input type="text" name="artist" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label>Year</label>
              <input type="number" name="year" min="1900" max="2025" />
            </div>
            <div class="form-field">
              <label>Genre</label>
              <input type="text" name="genre" />
            </div>
            <div class="form-field">
              <label>Label</label>
              <input type="text" name="label" />
            </div>
          </div>

          <div class="form-field">
            <label>Description</label>
            <textarea name="description" rows="3"></textarea>
          </div>

          <div class="tracks-section">
            <div class="section-header">
              <h3 class="section-title">Tracks</h3>
              <button
                type="button"
                onclick="addTrackInput()"
                class="btn-secondary"
              >
                + Add Track
              </button>
            </div>
            <div id="tracksContainer" class="tracks-container"></div>
          </div>

          <div class="form-actions">
            <button
              type="button"
              onclick="closeAddModal()"
              class="btn-secondary"
            >
              Cancel
            </button>
            <button type="submit" class="btn-primary">
              <span id="submitText">Add to Collection</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
